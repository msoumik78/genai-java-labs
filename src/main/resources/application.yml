server:
  port: 18080

spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0
          num-predict: 400
      embedding:
        options:
          model: nomic-embed-text

rag:
  passage-character-limit: 700
  passage-overlap-characters: 120
  vector-hit-count: 8
  lexical-hit-count: 8
  reciprocal-rank-constant: 60
  rerank-pool-size: 8
  passages-in-prompt: 3
  cross-encoder-directory: models/ms-marco-MiniLM-L6
