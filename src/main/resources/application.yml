server.port: 18082

spring.datasource.url: jdbc:postgresql://127.0.0.1:5433/lab2
spring.datasource.username: postgres
spring.datasource.password: postgres

# BAAI/bge-small-en-v1.5 via ONNX in-process (Xenova export). First start downloads ~133MB.
spring.ai.model.embedding: transformers
spring.ai.embedding.transformer.onnx.model-uri: https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/main/onnx/model.onnx
spring.ai.embedding.transformer.tokenizer.uri: https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/main/tokenizer.json

lab.embedding-dims: 384
lab.top-k: 3
lab.max-distance: 0.55
lab.embedder: bge-small-en-v1.5
lab.embed-query-prefix: "Represent this sentence for searching relevant passages: "
