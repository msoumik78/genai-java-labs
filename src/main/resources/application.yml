server:
  port: 18080

spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:1b
          temperature: 0

lab:
  similarity-threshold: 0.80
  cache-capacity: 128
  dimensions: 256
  max-tokens: 128
  model-path: models/nomic-embed-text-v1.5/model_quantized.onnx
  tokenizer-path: models/nomic-embed-text-v1.5/tokenizer.json
